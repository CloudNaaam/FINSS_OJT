{% extends 'base.html' %}

{% block title %}BOARD - FINSS Admin Portal{% endblock %}
{% block page_id %}posts{% endblock %}
{% block header_title %}BOARD{% endblock %}

{% block content %}
<!-- Search & Toolbar -->
<div class="toolbar">
    <div class="search-group">
        <input type="text" id="postSearchInput" class="form-control" placeholder="게시글 제목, 작성자, 내용 검색" onkeyup="if(event.key === 'Enter') loadPostsTable()" style="max-width: 360px;">
        <button class="btn btn-primary" onclick="loadPostsTable()"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
    </div>
</div>

<!-- Posts Table -->
<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>글 번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>분류</th>
                <th>작성일</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="postsTableBody">
            <!-- Dynamically loaded via client JS -->
        </tbody>
    </table>
</div>
{% endblock %}
