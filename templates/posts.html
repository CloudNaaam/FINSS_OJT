{% extends 'base.html' %}

{% block title %}게시글 관리 - OJT Admin Console{% endblock %}
{% block page_id %}posts{% endblock %}
{% block header_title %}게시글 관리 (/api/board, /api/admin/&lt;board_id&gt;/delete){% endblock %}

{% block content %}
<!-- Search & Toolbar -->
<div class="toolbar">
    <div class="search-group">
        <input type="text" id="postSearchInput" class="form-control" placeholder="게시글 제목, 작성자, 내용 검색" onkeyup="if(event.key === 'Enter') loadPostsTable()" style="max-width: 360px;">
        <button class="btn btn-primary" onclick="loadPostsTable()">검색</button>
    </div>
</div>

<!-- Posts Table -->
<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>글 번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>분류</th>
                <th>작성일</th>
                <th>관리</th>
            </tr>
        </thead>
        <tbody id="postsTableBody">
            <!-- Dynamically loaded via /api/board -->
        </tbody>
    </table>
</div>
{% endblock %}
