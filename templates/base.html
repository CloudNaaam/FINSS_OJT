<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ADMIN PORTAL - FINSS OJT{% endblock %}</title>

    <!-- FontAwesome 6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Admin CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body data-page="{% block page_id %}dashboard{% endblock %}">

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">F</div>
            <div>
                <div class="brand-title">FINSS ADMIN</div>
                <div class="brand-sub">Management System</div>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="fa-solid fa-chart-line"></i>
                <span>DASHBOARD</span>
            </a>

            <a href="/users" class="nav-item {% if active_page == 'users' %}active{% endif %}">
                <i class="fa-solid fa-users"></i>
                <span>USERS</span>
            </a>

            <a href="/posts" class="nav-item {% if active_page == 'posts' %}active{% endif %}">
                <i class="fa-solid fa-folder-open"></i>
                <span>BOARD</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            FINSS Admin Console v1.0
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="page-title">
                {% block header_title %}DASHBOARD{% endblock %}
            </div>

            <div class="top-right-actions">
                <div class="server-status">
                    <span class="status-dot"></span>
                    <span>System Online</span>
                </div>

                <div class="admin-profile">
                    <i class="fa-solid fa-user-shield"></i> Administrator
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-container">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Global Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Client JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
